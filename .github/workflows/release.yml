name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    # Some runners (arm64 Linux, macOS) are not available on every plan or may sit in the
    # queue for a long time. A missing leg degrades gracefully: the npm wrapper and the
    # README point macOS users at the wheel/pipx instead of a binary.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: AiProof_Linux_x64
          - os: ubuntu-24.04-arm
            artifact: AiProof_Linux_arm64
            experimental: true
          - os: macos-13
            artifact: AiProof_macOS_x64
            experimental: true
          - os: macos-14
            artifact: AiProof_macOS_arm64
            experimental: true
          - os: windows-latest
            artifact: AiProof_Win_x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: generate icon assets
        run: python tools/gen_assets.py
      - name: build binary (unix)
        if: runner.os != 'Windows'
        run: bash tools/build_exe.sh
      - name: build binary (windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: tools\build_exe.bat
      - name: collect artifacts
        shell: bash
        run: |
          mkdir -p out
          find dist -maxdepth 1 -type f -name "AiProof_*" -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*

  build-sdist-wheel:
    name: build (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: add checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-sdist-wheel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: produce SHA256SUMS
        run: |
          cd artifacts
          rm -f SHA256SUMS
          for f in *; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            **AiProof by SYSIK** release.

            Every asset below is listed in `SHA256SUMS`. Verify it before running:

            ```
            sha256sum -c SHA256SUMS
            ```

            Install:

            ```
            # Python (all platforms)
            pipx install aiproof-sysik
            # npm (downloads a verified standalone binary)
            npm install -g aiproof-sysik
            # or the wheel attached below:
            pip install aiproof_sysik-<version>-py3-none-any.whl
            ```

            Binaries are not code-signed yet — see `docs/SIGNING.md`.
