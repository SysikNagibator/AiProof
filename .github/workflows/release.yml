name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: AiProof_Linux
          - os: macos-latest
            artifact: AiProof_macOS
          - os: windows-latest
            artifact: AiProof_Win
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: generate icon assets
        run: python tools/gen_assets.py
      - name: build binary (unix)
        if: runner.os != 'Windows'
        run: bash tools/build_exe.sh
      - name: build binary (windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: tools\build_exe.bat
      - name: collect artifacts
        shell: bash
        run: |
          mkdir -p out
          find dist -maxdepth 1 -type f -name "AiProof_*" -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: [build-binaries]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: produce SHA256SUMS
        run: |
          cd artifacts
          rm -f SHA256SUMS
          for f in *; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            **AiProof by SYSIK** release.

            Every asset below is listed in `SHA256SUMS`. Verify it before running:

            ```
            sha256sum -c SHA256SUMS
            ```

            Prefer `pipx install aiproof-sysik` or `npm i -g aiproof-sysik`.
            Binaries are not code-signed yet — see `docs/SIGNING.md`.
