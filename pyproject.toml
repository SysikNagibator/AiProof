[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aiproof-sysik"
version = "0.1.0"
description = "AiProof: the agent says done. AiProof checks the receipts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SYSIK" }]
keywords = ["ai-agents", "verification", "hooks", "cli", "tui", "offline", "ledger"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "rich>=13.0.0",
  "wcwidth>=0.2.5",
  "tomli-w>=1.0.0",
]

[project.optional-dependencies]
sign = ["cryptography>=42.0.0"]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  "mypy>=1.10",
  "pyinstaller>=6.0",
]

[project.scripts]
aiproof = "aiproof.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aiproof"]

[tool.hatch.build.targets.wheel.force-include]
"src/aiproof/i18n/catalogs" = "aiproof/i18n/catalogs"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",    # line length is enforced by the formatter
  "RUF001",  # ambiguous unicode: intentional (Cyrillic + box-drawing UI)
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["aiproof"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/aiproof"]
warn_unreachable = true
disallow_any_generics = true
pretty = true

[[tool.mypy.overrides]]
module = ["rich.*", "wcwidth.*", "tomli_w.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["src"]

[tool.coverage.run]
source = ["aiproof"]
branch = true

[tool.coverage.report]
fail_under = 85
