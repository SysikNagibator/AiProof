<?xml version="1.0" encoding="UTF-8"?>
<!--
  AiProof by SYSIK - logo (source of truth).
  Calm green terminal aesthetic: a rounded dark tile with a shield and a check mark,
  matching the TUI's green theme. Raster outputs (.png/.ico/.icns) are generated from this
  file by tools/build_icon.py or tools/gen_assets.py.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"
     role="img" aria-label="AiProof by SYSIK">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07210f"/>
      <stop offset="1" stop-color="#0b3a1c"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ef08a"/>
      <stop offset="1" stop-color="#12a150"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none"
        stroke="#1d5c33" stroke-width="6"/>

  <!-- shield -->
  <path d="M256 96 L392 152 V268 C392 348 332 402 256 424 C180 402 120 348 120 268
           V152 Z"
        fill="none" stroke="url(#mark)" stroke-width="18" stroke-linejoin="round" opacity="0.9"
        filter="url(#soft)"/>
  <path d="M256 96 L392 152 V268 C392 348 332 402 256 424 C180 402 120 348 120 268
           V152 Z"
        fill="none" stroke="url(#mark)" stroke-width="18" stroke-linejoin="round"/>

  <!-- check mark -->
  <path d="M196 262 L238 306 L322 212" fill="none" stroke="#8affab" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- wordmark -->
  <text x="256" y="486" text-anchor="middle" font-family="monospace" font-size="52"
        font-weight="700" letter-spacing="6" fill="#8affab">AIPROOF</text>
</svg>
